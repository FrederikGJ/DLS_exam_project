# All values can be overridden with environment variables.
# Defaults are ONLY meant for local development (docker-compose / IDE).
spring:
  application:
    name: flight-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flight_db}
    username: ${DB_USERNAME:flight}
    password: ${DB_PASSWORD:flight}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway - never "update"
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:airport}
    password: ${RABBITMQ_PASSWORD:airport}
    publisher-confirm-type: simple      # OutboxRelay waits for broker confirms before marking rows as sent
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false     # after retries -> reject -> dead-letter queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2.0
          max-interval: 3s
  graphql:
    path: ${GRAPHQL_PATH:/api/flights/graphql}
    graphiql:
      enabled: true
      path: /graphiql
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak (see k8s/README.md "Keycloak (login)"): a token is accepted when its signature matches a key
          # from JWK_SET_URI (an address the service can reach) and its `iss` claim equals OIDC_ISSUER_URI (the
          # browser-facing address the token was issued for). Both are set, so Spring never calls OIDC discovery.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/airport}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/airport/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # metrics: outbox.pending (unpublished events)
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,rabbit

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}   # comma separated, see config/SecurityConfig
  messaging:
    exchange: airport.events
    dead-letter-exchange: airport.events.dlx
    producer: flight-service
    queues:
      booking-events: flight-service.booking-events
      dead-letter: flight-service.dlq
  outbox:                               # transactional outbox (see messaging/OutboxRelay)
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: 100
    confirm-timeout-ms: 5000
    retention: 7d                       # published rows older than this are deleted
    cleanup-interval-ms: 3600000

logging:
  level:
    dk.airport: INFO
    org.springframework.amqp: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  graphql:
    graphiql:
      enabled: false
logging:
  structured:
    format:
      console: logstash          # JSON logs in prod, human readable in dev
