# All values can be overridden with environment variables.
# Defaults are ONLY meant for local development (docker-compose / IDE).
spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/booking_db}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway - never "update"
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:airport}
    password: ${RABBITMQ_PASSWORD:airport}
    template:
      # The relay sends the original traceparent from the outbox row.
      observation-enabled: false
    publisher-confirm-type: simple      # OutboxRelay waits for broker confirms before marking rows as sent
    listener:
      simple:
        observation-enabled: true
        acknowledge-mode: auto
        default-requeue-rejected: false     # after retries -> reject -> dead-letter queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2.0
          max-interval: 3s
  graphql:
    path: ${GRAPHQL_PATH:/api/bookings/graphql}
    graphiql:
      enabled: true
      path: /graphiql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/airport}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/airport/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # metrics: outbox.pending (unpublished events)
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,rabbit

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  messaging:
    exchange: airport.events
    dead-letter-exchange: airport.events.dlx
    producer: booking-service
    queues:
      payment-events: booking-service.payment-events
      baggage-events: booking-service.baggage-events
      flight-events: booking-service.flight-events
      dead-letter: booking-service.dlq
  outbox:                               # transactional outbox (see messaging/OutboxRelay)
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: 100
    confirm-timeout-ms: 5000
    retention: 7d                       # published rows older than this are deleted
    cleanup-interval-ms: 3600000
  flight-service:
    url: ${FLIGHT_SERVICE_URL:http://localhost:8081/api/flights/graphql}
    timeout: ${FLIGHT_SERVICE_TIMEOUT:5s}

logging:
  level:
    dk.airport: INFO
    org.springframework.amqp: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  graphql:
    graphiql:
      enabled: false
logging:
  structured:
    format:
      console: logstash          # JSON logs in prod, human readable in dev
