    title: flight-service forbruger flight-service.booking-events
    summary: booking.confirmed markerer sædet optaget; booking.cancelled frigiver det.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Fejler handleren, prøves beskeden 3 gange (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til flight-service.dlq.'
