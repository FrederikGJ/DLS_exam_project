components:
  schemas:
    EventEnvelope:
      type: object
      description: Fælles envelope for alle events på airport.events (identisk record `EventEnvelope` i hver service). Kun
        `payload` er eventspecifik.
      required:
      - eventId
      - eventType
      - occurredAt
      - producer
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          description: UUID. Dedup-nøgle for consumers (`processed_event`); samme værdi som AMQP-egenskaben message-id.
        eventType:
          type: string
          description: Eventnavnet = routing key, fx `booking.confirmed`. Et brud giver et nyt navn med suffiks (`…v2`).
        occurredAt:
          type: string
          format: date-time
          description: Hvornår ændringen skete (producentens ur, UTC). Afgør rækkefølgen i last-writer-wins-handlers.
        producer:
          type: string
          enum:
          - flight-service
          - booking-service
          - payment-service
          - baggage-service
          description: Servicen, der publicerede eventet.
        payload:
          type: object
          description: Eventspecifikke data – se det enkelte message.
    AmqpHeaders:
      type: object
      description: AMQP-headers sat af OutboxRelay.
      properties:
        traceparent:
          type: string
          pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
          examples:
          - 00-1423cedc67a40f21630c5d4e17f2136d-452ff6d87cae9da2-01
          description: W3C Trace Context for den request/det event, der publicerede eventet. Consumeren fortsætter samme trace.
            Mangler, hvis der ikke var en aktiv span.
    FlightStatus:
      type: string
      enum:
      - SCHEDULED
      - BOARDING
      - DEPARTED
      - DELAYED
      - CANCELLED
    BookingStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - CANCELLED
      - CHECKED_IN
    BaggageType:
      type: string
      enum:
      - CHECKED
      - CABIN
      - SPECIAL
    BaggageStatus:
      type: string
      enum:
      - REGISTERED
      - SECURITY
      - LOADED
      - IN_TRANSIT
      - ARRIVED
      - LOST
    Money:
      type: number
      minimum: 0
      description: Beløb med to decimaler (Java BigDecimal).
    FlightCreatedPayload:
      type: object
      required:
      - flightId
      - flightNumber
      - airlineCode
      - origin
      - destination
      - scheduledDeparture
      - scheduledArrival
      - status
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
          examples:
          - SK9999
        airlineCode:
          type: string
          examples:
          - SK
        origin:
          type: string
          description: IATA-lufthavnskode
        destination:
          type: string
          description: IATA-lufthavnskode
        scheduledDeparture:
          type: string
          format: date-time
        scheduledArrival:
          type: string
          format: date-time
        gate:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/FlightStatus'
    FlightStatusChangedPayload:
      type: object
      required:
      - flightId
      - flightNumber
      - oldStatus
      - newStatus
      - scheduledDeparture
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
        oldStatus:
          $ref: '#/components/schemas/FlightStatus'
        newStatus:
          $ref: '#/components/schemas/FlightStatus'
        scheduledDeparture:
          type: string
          format: date-time
        gate:
          type:
          - string
          - 'null'
          description: Flyets gate på tidspunktet – booking-service opdaterer også sit gate-snapshot fra den.
    FlightGateChangedPayload:
      type: object
      required:
      - flightId
      - flightNumber
      - newGate
      - scheduledDeparture
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
        oldGate:
          type:
          - string
          - 'null'
        newGate:
          type: string
        scheduledDeparture:
          type: string
          format: date-time
    FlightCancelledPayload:
      type: object
      required:
      - flightId
      - flightNumber
      - scheduledDeparture
      - reason
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
        scheduledDeparture:
          type: string
          format: date-time
        reason:
          type: string
          examples:
          - Flight cancelled by airline
    BookingPassenger:
      type: object
      required:
      - firstName
      - lastName
      - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
    BookingPayload:
      type: object
      description: Fælles payload for booking.created, booking.confirmed, booking.cancelled og booking.checkedin.
      required:
      - bookingId
      - bookingReference
      - flightId
      - flightNumber
      - departureTime
      - seatNumber
      - price
      - currency
      - status
      - passenger
      properties:
        bookingId:
          type: integer
        bookingReference:
          type: string
          pattern: ^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$
          description: 6 tegn uden 0/O/1/I.
        flightId:
          type: integer
        flightNumber:
          type: string
        departureTime:
          type: string
          format: date-time
        seatNumber:
          type: string
          pattern: ^[0-9]{1,3}[A-Z]$
          examples:
          - 12C
        price:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          examples:
          - DKK
        status:
          $ref: '#/components/schemas/BookingStatus'
        passenger:
          $ref: '#/components/schemas/BookingPassenger'
        reason:
          type:
          - string
          - 'null'
          description: 'Kun sat på booking.cancelled: `Cancelled by passenger`, `Flight cancelled`, `Payment failed: <årsag>`
            eller `Payment not received within <tid>`.'
    BookingPaymentRejectedPayload:
      type: object
      required:
      - bookingId
      - bookingReference
      - status
      - paymentId
      - amount
      - currency
      - reason
      properties:
        bookingId:
          type: integer
        bookingReference:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatus'
          description: Altid CANCELLED.
        paymentId:
          type: integer
          description: Betalingen, der skal refunderes.
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        reason:
          type: string
          examples:
          - Payment arrived after the booking was cancelled (Payment not received within 15 minutes)
    PaymentCompletedPayload:
      type: object
      required:
      - paymentId
      - bookingReference
      - amount
      - currency
      - cardLast4
      properties:
        paymentId:
          type: integer
        bookingReference:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        cardLast4:
          type: string
          pattern: ^[0-9]{4}$
          description: Kun de sidste fire cifre – kortnummeret gemmes aldrig.
    PaymentFailedPayload:
      type: object
      required:
      - paymentId
      - bookingReference
      - amount
      - currency
      - cardLast4
      - failureReason
      properties:
        paymentId:
          type: integer
        bookingReference:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        cardLast4:
          type: string
          pattern: ^[0-9]{4}$
        failureReason:
          type: string
          examples:
          - Insufficient funds
          - Card expired
    PaymentRefundedPayload:
      type: object
      required:
      - paymentId
      - bookingReference
      - amount
      - currency
      properties:
        paymentId:
          type: integer
        bookingReference:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
    BaggageRegisteredPayload:
      type: object
      required:
      - tagNumber
      - bookingReference
      - passengerName
      - flightNumber
      - weightKg
      - type
      - status
      properties:
        tagNumber:
          type: string
          pattern: ^BAG-[A-Z0-9]{8}$
        bookingReference:
          type: string
        passengerName:
          type: string
        flightNumber:
          type: string
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 32
        type:
          $ref: '#/components/schemas/BaggageType'
        status:
          $ref: '#/components/schemas/BaggageStatus'
        lastLocation:
          type:
          - string
          - 'null'
          description: 'Tilføjet september 2026 (bagudkompatibelt): `CHECK_IN` ved registrering.'
    BaggageStatusChangedPayload:
      type: object
      required:
      - tagNumber
      - bookingReference
      - flightNumber
      - oldStatus
      - newStatus
      properties:
        tagNumber:
          type: string
          pattern: ^BAG-[A-Z0-9]{8}$
        bookingReference:
          type: string
        flightNumber:
          type: string
        oldStatus:
          $ref: '#/components/schemas/BaggageStatus'
        newStatus:
          $ref: '#/components/schemas/BaggageStatus'
        location:
          type:
          - string
          - 'null'
          description: Ny lokation, fx `Belt 4` eller `RETURN_DESK` ved aflyst fly.
  messages:
    FlightCreated:
      name: flight.created
      title: Fly oprettet
      summary: Et nyt fly med sæder er oprettet (`createFlight`).
      contentType: application/json
      headers:
        $ref: '#/components/schemas/AmqpHeaders'
      correlationId:
        $ref: '#/components/correlationIds/EventId'
      tags:
      - name: flight-service
      bindings:
        amqp:
          contentEncoding: UTF-8
          messageType: flight.created
          bindingVersion: 0.3.0
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: flight.created
            producer:
              const: flight-service
            payload:
              $ref: '#/components/schemas/FlightCreatedPayload'
      examples:
      - name: flightCreated
        payload:
          eventId: 884da3e7-c424-46b1-a65d-ddc2ce0d2631
          eventType: flight.created
          occurredAt: '2026-09-17T07:04:07.299Z'
          producer: flight-service
          payload:
            flightId: 11
            flightNumber: SK9999
            airlineCode: SK
            origin: CPH
            destination: AAL
            scheduledDeparture: '2026-09-20T09:00:00Z'
            scheduledArrival: '2026-09-20T09:45:00Z'
            gate: A1
            status: SCHEDULED
    FlightStatusChanged:
      name: flight.status.changed
      title: Flystatus ændret
      summary: Status er ændret (`updateFlightStatus`). Ved CANCELLED publiceres også flight.cancelled.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/AmqpHeaders'
      correlationId:
        $ref: '#/components/correlationIds/EventId'
      tags:
      - name: flight-service
      bindings:
