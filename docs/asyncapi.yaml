        ack: true
        bindingVersion: 0.3.0
  bookingServiceReceivesPaymentEvents:
    action: receive
    channel:
      $ref: '#/channels/bookingServicePaymentEventsQueue'
    title: booking-service forbruger booking-service.payment-events
    summary: payment.completed bekræfter en PENDING_PAYMENT-booking (→ booking.confirmed); payment.failed aflyser den (→ booking.cancelled
      med årsagen). Alle tre, også payment.refunded, opdaterer betalingslisten i read-modellen `booking_overview`.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Fejler handleren, prøves beskeden 3 gange (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til booking-service.dlq.'
    messages:
    - $ref: '#/channels/bookingServicePaymentEventsQueue/messages/PaymentCompleted'
    - $ref: '#/channels/bookingServicePaymentEventsQueue/messages/PaymentFailed'
    - $ref: '#/channels/bookingServicePaymentEventsQueue/messages/PaymentRefunded'
