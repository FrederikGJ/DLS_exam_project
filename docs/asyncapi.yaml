      $ref: '#/channels/bookingServiceBaggageEventsQueue'
    title: booking-service forbruger booking-service.baggage-events
    summary: baggage.registered og baggage.status.changed opdaterer bagagelisten i read-modellen `booking_overview` (CQRS,
      ticket 7). Ingen events publiceres.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Kommutativ: en ældre observation (occurredAt) overskriver ikke en nyere. Fejler handleren, prøves beskeden 3 gange
      (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til booking-service.dlq.'
    messages:
    - $ref: '#/channels/bookingServiceBaggageEventsQueue/messages/BaggageRegistered'
    - $ref: '#/channels/bookingServiceBaggageEventsQueue/messages/BaggageStatusChanged'
    tags:
    - name: booking-service
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
  bookingServiceReceivesFlightEvents:
    action: receive
    channel:
      $ref: '#/channels/bookingServiceFlightEventsQueue'
    title: booking-service forbruger booking-service.flight-events
    summary: flight.status.changed og flight.gate.changed opdaterer flysnapshot (status/gate) på bookingerne; flight.cancelled
      aflyser alle aktive bookinger på flyet (→ booking.cancelled). flight.created ignoreres.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Fejler handleren, prøves beskeden 3 gange (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til booking-service.dlq.'
    messages:
    - $ref: '#/channels/bookingServiceFlightEventsQueue/messages/FlightStatusChanged'
    - $ref: '#/channels/bookingServiceFlightEventsQueue/messages/FlightGateChanged'
    - $ref: '#/channels/bookingServiceFlightEventsQueue/messages/FlightCancelled'
    tags:
    - name: booking-service
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
  paymentServiceReceivesBookingEvents:
    action: receive
    channel:
      $ref: '#/channels/paymentServiceBookingEventsQueue'
    title: payment-service forbruger payment-service.booking-events
    summary: booking.cancelled refunderer alle gennemførte betalinger på bookingen (→ payment.refunded). Øvrige booking-events
      ignoreres.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Fejler handleren, prøves beskeden 3 gange (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til payment-service.dlq.'
    messages:
    - $ref: '#/channels/paymentServiceBookingEventsQueue/messages/BookingCancelled'
    tags:
    - name: payment-service
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
  baggageServiceReceivesBookingEvents:
    action: receive
    channel:
      $ref: '#/channels/baggageServiceBookingEventsQueue'
    title: baggage-service forbruger baggage-service.booking-events
    summary: Alle fire booking-events opdaterer booking_snapshot, som registrering af bagage valideres mod.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Fejler handleren, prøves beskeden 3 gange (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til baggage-service.dlq.'
    messages:
    - $ref: '#/channels/baggageServiceBookingEventsQueue/messages/BookingCreated'
    - $ref: '#/channels/baggageServiceBookingEventsQueue/messages/BookingConfirmed'
    - $ref: '#/channels/baggageServiceBookingEventsQueue/messages/BookingCancelled'
    - $ref: '#/channels/baggageServiceBookingEventsQueue/messages/BookingCheckedIn'
    tags:
    - name: baggage-service
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
  baggageServiceReceivesFlightEvents:
    action: receive
    channel:
      $ref: '#/channels/baggageServiceFlightEventsQueue'
    title: baggage-service forbruger baggage-service.flight-events
    summary: flight.cancelled sender flyets bagage til RETURN_DESK (→ baggage.status.changed) og sætter booking_snapshot til
      CANCELLED. Øvrige flight-events ignoreres.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Fejler handleren, prøves beskeden 3 gange (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til baggage-service.dlq.'
    messages:
    - $ref: '#/channels/baggageServiceFlightEventsQueue/messages/FlightCancelled'
    tags:
    - name: baggage-service
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
  shopServiceReceivesFlightEvents:
    action: receive
    channel:
      $ref: '#/channels/shopServiceFlightEventsQueue'
    title: shop-service forbruger shop-service.flight-events
    summary: flight.gate.changed logges (ingen tilstandsændring). Øvrige flight-events ignoreres.
    description: 'Idempotent: eventId registreres i processed_event i samme transaktion som ændringen, så et duplikat ignoreres.
      Fejler handleren, prøves beskeden 3 gange (backoff 500 ms, ×2, maks. 3 s) og afvises derefter til shop-service.dlq.'
    messages:
    - $ref: '#/channels/shopServiceFlightEventsQueue/messages/FlightGateChanged'
    tags:
    - name: shop-service
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
components:
  schemas:
    EventEnvelope:
      type: object
      description: Fælles envelope for alle events på airport.events (identisk record `EventEnvelope` i hver service). Kun
        `payload` er eventspecifik.
      required:
      - eventId
      - eventType
      - occurredAt
      - producer
      - payload
      properties:
        eventId:
          type: string
          format: uuid
          description: UUID. Dedup-nøgle for consumers (`processed_event`); samme værdi som AMQP-egenskaben message-id.
        eventType:
          type: string
          description: Eventnavnet = routing key, fx `booking.confirmed`.
        occurredAt:
          type: string
          format: date-time
          description: Hvornår eventet blev skrevet til outboxen (producentens ur, UTC).
        producer:
          type: string
          enum:
          - flight-service
          - booking-service
          - payment-service
          - baggage-service
          description: Servicen, der publicerede eventet (`app.messaging.producer`).
        payload:
          type: object
          description: Eventspecifikke data – se det enkelte message.
    FlightStatus:
      type: string
      enum:
      - SCHEDULED
      - BOARDING
      - DEPARTED
      - DELAYED
      - CANCELLED
    BookingStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - CANCELLED
      - CHECKED_IN
    BaggageType:
      type: string
      enum:
      - CHECKED
      - CABIN
      - SPECIAL
    BaggageStatus:
      type: string
      enum:
      - REGISTERED
      - SECURITY
      - LOADED
      - IN_TRANSIT
      - ARRIVED
      - LOST
    Money:
      type: number
      minimum: 0
      description: Beløb med to decimaler (Java BigDecimal).
    FlightCreatedPayload:
      type: object
      description: Record `FlightEvents.Created`.
      required:
      - flightId
      - flightNumber
      - airlineCode
      - origin
      - destination
      - scheduledDeparture
      - scheduledArrival
      - status
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
          examples:
          - SK9999
        airlineCode:
          type: string
          description: Flyselskabets IATA-kode.
          examples:
          - SK
        origin:
          type: string
          description: IATA-lufthavnskode
        destination:
          type: string
          description: IATA-lufthavnskode
        scheduledDeparture:
          type: string
          format: date-time
        scheduledArrival:
          type: string
          format: date-time
        gate:
          type:
          - string
          - 'null'
          description: null, hvis flyet endnu ikke har fået en gate.
        status:
          $ref: '#/components/schemas/FlightStatus'
    FlightStatusChangedPayload:
      type: object
      description: Record `FlightEvents.StatusChanged`.
      required:
      - flightId
      - flightNumber
      - oldStatus
      - newStatus
      - scheduledDeparture
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
        oldStatus:
          $ref: '#/components/schemas/FlightStatus'
        newStatus:
          $ref: '#/components/schemas/FlightStatus'
        scheduledDeparture:
          type: string
          format: date-time
        gate:
          type:
          - string
          - 'null'
          description: Flyets gate på tidspunktet – booking-service opdaterer også sit gate-snapshot fra den, hvis den er
            sat.
    FlightGateChangedPayload:
      type: object
      description: Record `FlightEvents.GateChanged`.
      required:
      - flightId
      - flightNumber
      - newGate
      - scheduledDeparture
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
        oldGate:
          type:
          - string
          - 'null'
          description: null, hvis flyet ikke havde en gate.
        newGate:
          type: string
          description: Trimmet og med store bogstaver.
        scheduledDeparture:
          type: string
          format: date-time
    FlightCancelledPayload:
      type: object
      description: Record `FlightEvents.Cancelled`.
      required:
      - flightId
      - flightNumber
      - scheduledDeparture
      - reason
      properties:
        flightId:
          type: integer
        flightNumber:
          type: string
        scheduledDeparture:
          type: string
          format: date-time
        reason:
          type: string
          examples:
          - Flight cancelled by airline
    BookingPassenger:
      type: object
      description: Record `BookingEvents.PassengerPayload`.
      required:
      - firstName
      - lastName
      - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
          description: Gemt med små bogstaver.
    BookingPayload:
      type: object
      description: Record `BookingEvents.BookingPayload` – fælles payload for booking.created, booking.confirmed, booking.cancelled
        og booking.checkedin. `status` er bookingens status efter ændringen.
      required:
      - bookingId
      - bookingReference
      - flightId
      - flightNumber
      - departureTime
      - seatNumber
      - price
      - currency
      - status
      - passenger
      properties:
        bookingId:
          type: integer
        bookingReference:
          type: string
          pattern: ^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$
          description: 6 tegn uden 0/O/1/I.
        flightId:
          type: integer
        flightNumber:
          type: string
        departureTime:
          type: string
          format: date-time
        seatNumber:
          type: string
          pattern: ^[0-9]{1,3}[A-Z]$
          examples:
          - 12C
        price: &id001
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          examples:
          - DKK
        status:
          $ref: '#/components/schemas/BookingStatus'
        passenger:
          $ref: '#/components/schemas/BookingPassenger'
        reason:
          type:
          - string
          - 'null'
          description: 'Kun sat på booking.cancelled: `Cancelled by passenger`, `Flight cancelled` eller `Payment failed:
            <failureReason>`; ellers null.'
    PaymentCompletedPayload:
      type: object
      description: Record `PaymentEvents.Completed`.
      required:
      - paymentId
      - bookingReference
      - amount
      - currency
      - cardLast4
      properties:
        paymentId:
          type: integer
        bookingReference:
          type: string
        amount: *id001
        currency:
          type: string
        cardLast4:
          type: string
          pattern: ^[0-9]{4}$
          description: Kun de sidste fire cifre – kortnummeret gemmes aldrig.
    PaymentFailedPayload:
      type: object
      description: Record `PaymentEvents.Failed`.
      required:
      - paymentId
      - bookingReference
      - amount
      - currency
      - cardLast4
      - failureReason
      properties:
        paymentId:
          type: integer
        bookingReference:
          type: string
        amount: *id001
        currency:
          type: string
        cardLast4:
          type: string
          pattern: ^[0-9]{4}$
        failureReason:
          type: string
          examples:
          - Insufficient funds
          - Card expired
    PaymentRefundedPayload:
      type: object
      description: Record `PaymentEvents.Refunded`.
      required:
      - paymentId
      - bookingReference
      - amount
      - currency
      properties:
        paymentId:
          type: integer
        bookingReference:
          type: string
        amount: *id001
        currency:
          type: string
    BaggageRegisteredPayload:
      type: object
      description: Record `BaggageEvents.Registered`.
      required:
      - tagNumber
      - bookingReference
      - passengerName
      - flightNumber
      - weightKg
      - type
      - status
      properties:
        tagNumber:
          type: string
          pattern: ^BAG-[A-Z0-9]{8}$
        bookingReference:
          type: string
        passengerName:
          type: string
        flightNumber:
          type: string
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 32
        type:
          $ref: '#/components/schemas/BaggageType'
        status:
          $ref: '#/components/schemas/BaggageStatus'
    BaggageStatusChangedPayload:
      type: object
      description: Record `BaggageEvents.StatusChanged`.
      required:
      - tagNumber
      - bookingReference
      - flightNumber
      - oldStatus
      - newStatus
      properties:
        tagNumber:
          type: string
          pattern: ^BAG-[A-Z0-9]{8}$
        bookingReference:
          type: string
        flightNumber:
          type: string
        oldStatus:
          $ref: '#/components/schemas/BaggageStatus'
        newStatus:
          $ref: '#/components/schemas/BaggageStatus'
        location:
          type:
          - string
          - 'null'
          description: Ny lokation, fx `Belt 4`, eller `RETURN_DESK` ved aflyst fly; uden ny lokation den hidtidige.
  messages:
    FlightCreated:
      name: flight.created
      title: Fly oprettet
      summary: Et nyt fly med sæder er oprettet (`createFlight`).
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/EventId'
      tags:
      - name: flight-service
      bindings:
        amqp:
          contentEncoding: UTF-8
          messageType: flight.created
          bindingVersion: 0.3.0
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: flight.created
            producer:
              const: flight-service
            payload:
              $ref: '#/components/schemas/FlightCreatedPayload'
      examples:
      - name: flightCreated
        payload:
          eventId: 3f1c2a8e-8d0e-4f3c-9a6b-1d2e3f4a5b6c
          eventType: flight.created
          occurredAt: '2026-09-11T10:15:30.123Z'
          producer: flight-service
          payload:
            flightId: 11
            flightNumber: SK9999
            airlineCode: SK
            origin: CPH
            destination: AAL
            scheduledDeparture: '2026-09-14T09:00:00Z'
            scheduledArrival: '2026-09-14T09:45:00Z'
            gate: A1
            status: SCHEDULED
    FlightStatusChanged:
      name: flight.status.changed
      title: Flystatus ændret
      summary: Status er ændret (`updateFlightStatus`). Ved CANCELLED publiceres også flight.cancelled.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/EventId'
      tags:
      - name: flight-service
      bindings:
        amqp:
          contentEncoding: UTF-8
          messageType: flight.status.changed
          bindingVersion: 0.3.0
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: flight.status.changed
            producer:
              const: flight-service
            payload:
              $ref: '#/components/schemas/FlightStatusChangedPayload'
      examples:
      - name: flightStatusChanged
        payload:
          eventId: 3f1c2a8e-8d0e-4f3c-9a6b-1d2e3f4a5b6c
          eventType: flight.status.changed
          occurredAt: '2026-09-11T10:15:30.123Z'
          producer: flight-service
          payload:
            flightId: 7
            flightNumber: DY1050
            oldStatus: SCHEDULED
            newStatus: DELAYED
            scheduledDeparture: '2026-09-11T17:00:00Z'
            gate: B15
    FlightGateChanged:
      name: flight.gate.changed
      title: Gate ændret
      summary: Gaten er ændret (`updateGate`).
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/EventId'
      tags:
      - name: flight-service
      bindings:
        amqp:
          contentEncoding: UTF-8
          messageType: flight.gate.changed
          bindingVersion: 0.3.0
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: flight.gate.changed
            producer:
              const: flight-service
            payload:
              $ref: '#/components/schemas/FlightGateChangedPayload'
      examples:
      - name: flightGateChanged
        payload:
          eventId: 3f1c2a8e-8d0e-4f3c-9a6b-1d2e3f4a5b6c
          eventType: flight.gate.changed
          occurredAt: '2026-09-11T10:15:30.123Z'
          producer: flight-service
          payload:
            flightId: 7
            flightNumber: DY1050
            oldGate: B15
            newGate: B17
            scheduledDeparture: '2026-09-11T17:00:00Z'
    FlightCancelled:
      name: flight.cancelled
      title: Fly aflyst
      summary: Flyet er aflyst. Publiceres ud over flight.status.changed, når status sættes til CANCELLED; et aflyst fly kan
        ikke ændre status igen.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/EventId'
      tags:
      - name: flight-service
      bindings:
        amqp:
          contentEncoding: UTF-8
          messageType: flight.cancelled
          bindingVersion: 0.3.0
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: flight.cancelled
            producer:
              const: flight-service
            payload:
              $ref: '#/components/schemas/FlightCancelledPayload'
      examples:
      - name: flightCancelled
        payload:
          eventId: 3f1c2a8e-8d0e-4f3c-9a6b-1d2e3f4a5b6c
          eventType: flight.cancelled
          occurredAt: '2026-09-11T10:15:30.123Z'
          producer: flight-service
          payload:
            flightId: 7
            flightNumber: DY1050
            scheduledDeparture: '2026-09-11T17:00:00Z'
            reason: Flight cancelled by airline
    BookingCreated:
      name: booking.created
      title: Booking oprettet
      summary: Et sæde er reserveret (`createBooking`); bookingen afventer betaling (PENDING_PAYMENT).
