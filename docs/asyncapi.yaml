    action: send
    channel:
      $ref: '#/channels/flightCreated'
    title: flight-service publicerer flight.created
    summary: 'Via transactional outbox: skrives i outbox_event i samme transaktion som ændringen og sendes af OutboxRelay
      med publisher confirms (at-least-once).'
    messages:
    - $ref: '#/channels/flightCreated/messages/FlightCreated'
    tags:
    - name: flight-service
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: false
        timestamp: true
        bindingVersion: 0.3.0
