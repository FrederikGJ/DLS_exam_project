# AsyncAPI 3.1 - the event contract of the airport system (dev plan DP-37).
# One RabbitMQ topic exchange, airport.events; routing key = event name. For each event: a channel (routing key),
# a message (envelope + payload schema + example) and a send operation for its producer; for each consumer queue: a
# channel (queue, binding pattern, dead-letter arguments) and a receive operation listing the events it acts on.
# Prose version with the reasoning: docs/events.md. Validated in CI (job `contracts`): the AsyncAPI CLI must accept the
# document, and every event name declared in the services' *Events classes must be a channel address here.
asyncapi: 3.1.0
id: urn:dk:airport:events
info:
  title: Airport events
  version: 1.0.0
  description: |-
    Den asynkrone kontrakt mellem services i lufthavnssystemet: alle events går over én RabbitMQ topic exchange, `airport.events`, med eventnavnet som routing key.

    * **Envelope:** alle beskeder er JSON med `eventId`, `eventType`, `occurredAt`, `producer` og en eventspecifik `payload`. AMQP-egenskaber: `content-type: application/json`, `message-id = eventId`, `type = eventType`, persistent levering, og headeren `traceparent` (W3C Trace Context).
    * **Levering:** transactional outbox + publisher confirms hos producenten (at-least-once, rækkefølge pr. producent); idempotente consumers (`processed_event`), 3 forsøg og derefter dead-letter queue pr. service.
    * **Rækkefølge på tværs af producenter** garanteres ikke; handlerne er kommutative (livscyklus, last-writer-wins på `occurredAt`, endelige tilstande).
    * **Versionering:** nye valgfrie felter er bagudkompatible; et brud får et nyt eventnavn med suffiks (fx `baggage.registered.v2`), publiceret ved siden af det gamle i en overgangsperiode.

    Læsevenlig udgave med begrundelser: docs/events.md. Valideres i CI med AsyncAPI CLI.
  tags:
  - name: flight-service
    description: Fly, sæder og gates (kilde til sandhed).
  - name: booking-service
    description: Bookinger, passagerer og booking-sagaen.
  - name: payment-service
    description: Simulerede kortbetalinger og refunderinger.
  - name: baggage-service
    description: Bagage bundet til bookinger.
  - name: shop-service
    description: Butikker og navigation; publicerer ingen events.
  - name: notification-job
    description: Mails pr. booking-event; KEDA ScaledJob.
  externalDocs:
    description: docs/events.md – eventkontrakten i prosa
    url: https://github.com/FrederikGJ/DLS_exam_project/blob/main/docs/events.md
defaultContentType: application/json
