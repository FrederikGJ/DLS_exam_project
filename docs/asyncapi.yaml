# AsyncAPI 3.1 - the event contract of the airport system (ticket 16).
# One RabbitMQ topic exchange, airport.events; routing key = event name. For each event: a channel (routing key),
# a message (envelope + payload schema + example) and a send operation for its producer; for each consumer queue: a
# channel (queue, binding pattern, dead-letter arguments, every event the binding routes there) and a receive operation
# listing the events the service acts on; for each dead-letter queue: a channel without operations (no consumer).
# Prose version with the reasoning: docs/events.md. Checked by scripts/check-asyncapi.sh (every event name and queue
# declared in the code must be a channel address here) and by the AsyncAPI CLI (validate --fail-severity=warn).
asyncapi: 3.1.0
id: urn:dk:airport:events
info:
  title: Airport events
  version: 1.0.0
  description: |-
    Den asynkrone kontrakt mellem services i lufthavnssystemet: alle events går over én RabbitMQ topic exchange, `airport.events`, med eventnavnet som routing key.

    * **Envelope:** alle beskeder er JSON med `eventId`, `eventType`, `occurredAt`, `producer` og en eventspecifik `payload`. AMQP-egenskaber: `content-type: application/json`, `content-encoding: UTF-8`, `message-id = eventId`, `type = eventType`, `timestamp` og persistent levering.
    * **Levering:** transactional outbox + publisher confirms hos producenten (at-least-once, rækkefølge pr. producent); idempotente consumers (`processed_event`), 3 forsøg med backoff og derefter dead-letter queue pr. service. Rækkefølge på tværs af producenter garanteres ikke.
    * **Køer:** én durable kø pr. service og interesse, bundet med `<domæne>.#` (`#` = 0..n ord, fordi fx `flight.status.changed` har tre segmenter). Alle events, der matcher bindingen, lander i køen; servicen registrerer dem, den ikke reagerer på, i `processed_event` og ignorerer dem.

    Læsevenlig udgave med begrundelser: docs/events.md.
  tags:
  - name: flight-service
    description: Fly, sæder og gates (kilde til sandhed).
  - name: booking-service
    description: Bookinger og passagerer.
  - name: payment-service
    description: Simulerede kortbetalinger og refunderinger.
  - name: baggage-service
    description: Bagage bundet til bookinger.
  - name: shop-service
    description: Butikker og navigation; publicerer ingen events.
  externalDocs:
    description: docs/events.md – eventkontrakten i prosa
    url: https://github.com/FrederikGJ/DLS_exam_project/blob/main/docs/events.md
defaultContentType: application/json
