server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Service URLs live in js/config.js. In Kubernetes the file is replaced by a ConfigMap
    # mount, so it must never be cached by the browser.
    location = /js/config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Hash based SPA: everything else falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
