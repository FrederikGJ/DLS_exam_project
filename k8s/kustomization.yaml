apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: airport

resources:
  - namespace.yaml
  - rabbitmq/secret.yaml
  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml
  - databases/flight-db.yaml
  - databases/booking-db.yaml
  - databases/payment-db.yaml
  - databases/baggage-db.yaml
  - databases/shop-db.yaml
  - services/flight-service.yaml
  - services/booking-service.yaml
  - services/payment-service.yaml
  - services/baggage-service.yaml
  - services/shop-service.yaml
  - frontend/frontend.yaml
  - keycloak/keycloak.yaml
  - tools/pgadmin.yaml   # dev/demo: pgAdmin at /pgadmin - remove this line to deploy without it
  - ingress.yaml

# The Keycloak realm (roles, client, test users) is imported from the same JSON file docker-compose.yml mounts.
configMapGenerator:
  - name: keycloak-realm
    files:
      - keycloak/realm-airport.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: airport
