apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: airport

resources:
  - namespace.yaml
  - rabbitmq/secret.yaml
  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml
  - databases/flight-db.yaml
  - databases/booking-db.yaml
  - databases/payment-db.yaml
  - databases/baggage-db.yaml
  - databases/shop-db.yaml
  - services/flight-service.yaml
  - services/booking-service.yaml
  - services/payment-service.yaml
  - services/baggage-service.yaml
  - services/shop-service.yaml
  - frontend/frontend.yaml
  - keycloak/keycloak.yaml
  - ingress.yaml
  # pgAdmin (dev/demo, no login of its own) is deliberately NOT here - opt in with `kubectl apply -k k8s/tools/`

# Both generated ConfigMaps use the same files docker-compose.yml mounts:
#   rabbitmq-plugins - enables rabbitmq_prometheus (scraped by k8s/observability)
#   keycloak-realm   - the Keycloak realm (roles, client, test users)
configMapGenerator:
  - name: rabbitmq-plugins
    files:
      - rabbitmq/enabled_plugins
  - name: keycloak-realm
    files:
      - keycloak/realm-airport.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: airport
