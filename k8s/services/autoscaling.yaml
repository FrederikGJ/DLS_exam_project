# HorizontalPodAutoscalers for the five backend services (ticket 13, krav §4 autoscaling / §1 skalerbarhed).
#
# Each service runs 2-5 pods. The HPA keeps the pods' average CPU near 70 % of their CPU *request* (250m), i.e. it
# adds a pod when the average goes above ~175m per pod. The Deployments have no `replicas:` field on purpose:
# the HPA owns the replica count, and a fixed value would reset it on every `kubectl apply -k k8s/`.
#
# Needs metrics-server (kind does not ship it) - see k8s/README.md "Autoscaling (HPA)". Without it the HPAs show
# <unknown> targets and keep the current replica count.
#
# Several pods are safe: the services are stateless, and the outbox relay uses a Postgres advisory lock so only one
# pod at a time publishes events.
#
# behavior:
#   scaleUp   - at most 1 new pod per 60 s, after 30 s of sustained load. A new JVM needs ~40-60 s to become Ready,
#               so this stops the HPA from adding pod after pod before the first new one has taken any load.
#   scaleDown - 1 pod per 30 s after 60 s below target (Kubernetes' default waits 300 s), so the demo is short
#               while short gaps between bursts of requests still do not remove pods.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-service
  labels:
    app.kubernetes.io/name: flight-service
    app.kubernetes.io/part-of: airport
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
