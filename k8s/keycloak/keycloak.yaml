# Keycloak - the OpenID Connect provider for the airport system (login, realm roles PASSENGER / OPERATIONS).
#
# How it fits together:
# - Reached through the Ingress at /auth. KC_HTTP_RELATIVE_PATH makes Keycloak serve under that prefix itself,
#   so no rewrite rule is needed - the same approach as the services' GRAPHQL_PATH and pgAdmin's SCRIPT_NAME.
# - Dev mode (`start-dev`) with an embedded H2 database in an emptyDir. The realm is imported on every pod
#   start from the ConfigMap `keycloak-realm`, which kustomization.yaml generates from
#   k8s/keycloak/realm-airport.json - the very same file docker-compose.yml mounts. Users created at runtime
#   (e.g. via the GitHub identity provider) are lost on restart; for a demo that is a feature (known state).
#   A shared cluster would need `start` + PostgreSQL + a real hostname with TLS instead.
# - KC_HOSTNAME pins every URL Keycloak publishes (issuer, discovery endpoints, redirects) to the browser-facing
#   URL http://localhost:8090/auth (the port kind-config.yaml maps the Ingress to). Every token then carries
#   iss=http://localhost:8090/auth/realms/airport, no matter whether it was requested through the Ingress or by
#   a pod via keycloak:8080. The services verify exactly that string (OIDC_ISSUER_URI) and fetch the signing
#   keys over the in-cluster URL (JWK_SET_URI) - they never use discovery, so neither side has to reach the
#   other's address. KC_PROXY_HEADERS and KC_HOSTNAME_BACKCHANNEL_DYNAMIC are deliberately NOT set: with them,
#   ingress-nginx's X-Forwarded-Port (80 = the port inside the kind node, not 8090) leaks into the discovery
#   document, whose token/jwks endpoints then read http://localhost/auth/... (verified 15-09-2026). With a full
#   URL in KC_HOSTNAME the proxy headers are not needed for URL generation; the only loss is that Keycloak's
#   event log shows the ingress pod's IP instead of the client's, which is fine for a dev cluster.
#   Details: k8s/README.md "Keycloak (login)". Another host/port (e.g. minikube): change KC_HOSTNAME here,
#   OIDC_ISSUER_URI in services/*.yaml and KEYCLOAK_URL in frontend/frontend.yaml together.
# - Health endpoints live on the management port 9000 (KC_HEALTH_ENABLED); the management path is pinned to `/`
#   so the probes do not move with KC_HTTP_RELATIVE_PATH.
#
# DEV VALUES ONLY in the Secret - replace before any shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: airport
type: Opaque
stringData:
  # Bootstrap admin for the master realm (admin console at /auth/admin/). Only used when the database is created,
  # which with H2 in an emptyDir is every pod start.
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: airport
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: airport
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: airport
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - secretRef:
                name: keycloak-secret
          env:
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HOSTNAME
              value: http://localhost:8090/auth
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: /
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: data
              mountPath: /opt/keycloak/data/h2
          # Import + first start takes 30-60 s alone and several minutes on a cold boot of the whole stack
          # (the Java services compete for the CPU), so allow up to 5 minutes before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: data
          emptyDir: {}
