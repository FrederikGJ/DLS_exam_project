# DEV VALUES ONLY in the Secret below - replace before any shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: booking-db-secret
  labels:
    app.kubernetes.io/name: booking-db
    app.kubernetes.io/part-of: airport
type: Opaque
stringData:
  POSTGRES_DB: booking_db
  POSTGRES_USER: booking
  POSTGRES_PASSWORD: booking
---
apiVersion: v1
kind: Service
metadata:
  name: booking-db
  labels:
    app.kubernetes.io/name: booking-db
    app.kubernetes.io/part-of: airport
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: booking-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: booking-db
  labels:
    app.kubernetes.io/name: booking-db
    app.kubernetes.io/part-of: airport
spec:
  serviceName: booking-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-db
        app.kubernetes.io/part-of: airport
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: booking-db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "booking", "-d", "booking_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "booking", "-d", "booking_db"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
