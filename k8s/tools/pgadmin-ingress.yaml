# Ingress rule for pgAdmin (dev/demo only). Kept apart from k8s/base/ingress.yaml so the base stack has no trace of
# pgAdmin; ingress-nginx merges the paths of all Ingress objects for the same (empty) host, and the longer prefix
# /pgadmin wins over the frontend's `/`. pgAdmin serves under /pgadmin itself (SCRIPT_NAME), so no rewrite.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/part-of: airport
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /pgadmin
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80
