# Ollama with qwen2.5:1.5b (image airport/ollama:local, see ollama/Dockerfile). CPU inference only; sized for a
# laptop cluster: the model needs ~1.5 GB RAM while loaded (unloaded after OLLAMA_KEEP_ALIVE idle time), and more
# CPU means a faster answer (2-6 s per question with 4 cores). No volume: the model is part of the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: airport
spec:
  replicas: 1
  strategy:
    type: Recreate                 # never two models in memory during a rollout on a laptop
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: airport
    spec:
      containers:
        - name: ollama
          image: airport/ollama:local
          imagePullPolicy: IfNotPresent    # loaded with `kind load docker-image`, never pulled
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          # /api/tags lists the models and answers as soon as the server is up (the model itself is loaded lazily
          # on the first question, which then takes 1-2 s longer).
          startupProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 3Gi
