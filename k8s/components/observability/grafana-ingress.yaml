# Ingress rule for Grafana (dev plan DP-34). Kept apart from k8s/base/ingress.yaml so the base stack has no trace of
# the observability component; ingress-nginx merges the paths of all Ingress objects for the same (empty) host, and the
# longer prefix /grafana wins over the frontend's `/`. Grafana serves under /grafana itself
# (GF_SERVER_SERVE_FROM_SUB_PATH), so no rewrite.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: airport
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
