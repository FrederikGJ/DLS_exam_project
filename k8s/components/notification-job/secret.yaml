# DEV VALUES ONLY - the same airport/airport user as k8s/base/rabbitmq/secret.yaml. KEDA's operator (namespace keda)
# reads the queue length through RabbitMQ's AMQP port, so the host is the fully qualified service name.
apiVersion: v1
kind: Secret
metadata:
  name: keda-notifications
  labels:
    app.kubernetes.io/name: notification-job
    app.kubernetes.io/part-of: airport
type: Opaque
stringData:
  host: amqp://airport:airport@rabbitmq.airport.svc.cluster.local:5672/
