apiVersion: v1
kind: ConfigMap
metadata:
  name: baggage-service-config
  labels:
    app.kubernetes.io/name: baggage-service
    app.kubernetes.io/part-of: airport
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:postgresql://baggage-db:5432/baggage_db
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  # Behind the Ingress, nginx forwards X-Forwarded-Port as the port it listens on inside the
  # node (80), not the host port kind maps it to (8090). Spring Boot trusts forwarded headers
  # on Kubernetes, so the browser origin http://localhost:8090 counts as cross-origin and must
  # be allowed explicitly. Keep this in sync with hostPort in k8s/kind-config.yaml.
  CORS_ALLOWED_ORIGINS: "http://airport.local,http://localhost,http://localhost:8090"
  GRAPHQL_PATH: /api/baggage/graphql
  # JWT validation (see keycloak/keycloak.yaml and README.md "Keycloak (login)"): OIDC_ISSUER_URI is the
  # browser-facing issuer tokens carry (must equal KC_HOSTNAME + /realms/airport), JWK_SET_URI the in-cluster
  # address the pod fetches the signing keys from.
  OIDC_ISSUER_URI: http://localhost:8090/auth/realms/airport
  JWK_SET_URI: http://keycloak:8080/auth/realms/airport/protocol/openid-connect/certs

---
# DEV VALUES ONLY - replace before any shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: baggage-service-secret
  labels:
    app.kubernetes.io/name: baggage-service
    app.kubernetes.io/part-of: airport
type: Opaque
stringData:
  DB_USERNAME: baggage
  DB_PASSWORD: baggage
  RABBITMQ_USERNAME: airport
  RABBITMQ_PASSWORD: airport
---
apiVersion: v1
kind: Service
metadata:
  name: baggage-service
  labels:
    app.kubernetes.io/name: baggage-service
    app.kubernetes.io/part-of: airport
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: baggage-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baggage-service
  labels:
    app.kubernetes.io/name: baggage-service
    app.kubernetes.io/part-of: airport
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: baggage-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baggage-service
        app.kubernetes.io/part-of: airport
    spec:
      # Hardening (dev plan DP-25, checked by Trivy in CI): the image already runs as the unprivileged user `app`
      # (uid 100, gid 101); here Kubernetes enforces it, and the containers get no capabilities, no privilege
      # escalation and a read-only root filesystem. The JVM only writes to /tmp (Tomcat's work directory), which is
      # an emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      # Wait until Postgres accepts connections. The JVM now boots faster than the database on a
      # cold start, and Flyway fails hard on "Connection refused" (exit 1 -> restart with back-off).
      # postgres:16-alpine is already on the node (the databases use it), so nothing extra to pull.
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h baggage-db -p 5432 -U baggage -d baggage_db -q; do
                echo "waiting for baggage-db:5432 ..."
                sleep 2
              done
              echo "baggage-db:5432 accepts connections"
          securityContext:
            runAsUser: 70                    # the postgres user of postgres:16-alpine; pg_isready needs no root
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: baggage-service
          image: airport/baggage-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: baggage-service-config
            - secretRef:
                name: baggage-service-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 640Mi
