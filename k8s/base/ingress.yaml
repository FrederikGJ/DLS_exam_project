# Single entry point. No host is set so the cluster IP (e.g. `minikube ip`) works directly.
# Each Spring service serves GraphQL at its own /api/<x>/graphql path (GRAPHQL_PATH), so no rewrite is needed.
# /graphiql and /actuator of the services are deliberately not exposed.
# /auth is Keycloak (login), which serves under that prefix itself (KC_HTTP_RELATIVE_PATH).
# /pgadmin (dev/demo database UI) is a separate Ingress in k8s/tools/pgadmin-ingress.yaml, only deployed by the
# dev-tools overlay; ingress-nginx merges the rules of all Ingress objects, longest prefix wins over `/`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airport
  labels:
    app.kubernetes.io/name: airport-ingress
    app.kubernetes.io/part-of: airport
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/flights
            pathType: Prefix
            backend:
              service:
                name: flight-service
                port:
                  number: 8080
          - path: /api/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8080
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8080
          - path: /api/baggage
            pathType: Prefix
            backend:
              service:
                name: baggage-service
                port:
                  number: 8080
          - path: /api/shops
            pathType: Prefix
            backend:
              service:
                name: shop-service
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
