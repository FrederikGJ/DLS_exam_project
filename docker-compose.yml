# Airport system - local development stack.
# Start everything with:  docker compose up --build
#
# Ports on host:
#   8080  frontend (nginx)
#   8081  flight-service     -> http://localhost:8081/api/flights/graphql   (GraphiQL: /graphiql)
#   8082  booking-service    -> http://localhost:8082/api/bookings/graphql
#   8083  payment-service    -> http://localhost:8083/api/payments/graphql
#   8084  baggage-service    -> http://localhost:8084/api/baggage/graphql
#   8085  shop-service       -> http://localhost:8085/api/shops/graphql
#   15672 RabbitMQ management UI (airport / airport)
#   8180  Keycloak (login): admin console http://localhost:8180/admin/ (admin / admin),
#         realm `airport` with test users anna/anna (PASSENGER) and ops/ops (OPERATIONS)
#   11434 Ollama (local LLM behind shop-service askRoute) - only with `docker compose --profile ai up`
#   5433-5437 the five PostgreSQL instances (only for debugging with psql)
#
# Credentials below are DEV DEFAULTS ONLY. In Kubernetes they come from Secrets.

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment: &service-env
    SPRING_PROFILES_ACTIVE: dev
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_USERNAME: airport
    RABBITMQ_PASSWORD: airport
    CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    # JWT validation (see the keycloak service): issuer = the browser-facing URL tokens are issued for,
    # JWKS = where this container fetches the signing keys. Read queries need no token.
    OIDC_ISSUER_URI: http://localhost:8180/realms/airport
    JWK_SET_URI: http://keycloak:8080/realms/airport/protocol/openid-connect/certs
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

x-postgres-defaults: &postgres-defaults
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  # ------------------------------------------------------------------ infra
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: airport
      RABBITMQ_DEFAULT_PASS: airport
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Keycloak = the OpenID Connect provider (login, roles). Dev mode with an embedded H2 database and the realm
  # imported from k8s/keycloak/realm-airport.json on every start (single source for compose and Kubernetes).
  # KC_HOSTNAME pins every URL Keycloak publishes: a token says iss=http://localhost:8180/realms/airport no matter
  # whether it was requested from the browser (localhost:8180) or from inside the compose network (keycloak:8080),
  # and the discovery document always advertises the localhost:8180 endpoints. The services verify exactly that
  # issuer string (OIDC_ISSUER_URI) and fetch the signing keys over the internal URL (JWK_SET_URI) without using
  # discovery, so neither side needs to reach the other's address. See k8s/README.md "Keycloak (login)".
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
    ports: ["8180:8080"]
    volumes:
      - ./k8s/keycloak/realm-airport.json:/opt/keycloak/data/import/realm-airport.json:ro
    healthcheck:
      # The image has neither curl nor wget; bash's /dev/tcp against the management port (9000) does the job.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  flight-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: flight_db
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    ports: ["5433:5432"]
    volumes: [flight-db-data:/var/lib/postgresql/data]

  booking-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports: ["5434:5432"]
    volumes: [booking-db-data:/var/lib/postgresql/data]

  payment-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports: ["5435:5432"]
    volumes: [payment-db-data:/var/lib/postgresql/data]

  baggage-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: baggage_db
      POSTGRES_USER: baggage
      POSTGRES_PASSWORD: baggage
    ports: ["5436:5432"]
    volumes: [baggage-db-data:/var/lib/postgresql/data]

  shop-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports: ["5437:5432"]
    volumes: [shop-db-data:/var/lib/postgresql/data]

  # -------------------------------------------------------------- services
  flight-service:
    <<: *service-defaults
    build: ./flight-service
    image: airport/flight-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://flight-db:5432/flight_db
      DB_USERNAME: flight
      DB_PASSWORD: flight
    ports: ["8081:8080"]
    depends_on:
      flight-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  booking-service:
    <<: *service-defaults
    build: ./booking-service
    image: airport/booking-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://booking-db:5432/booking_db
      DB_USERNAME: booking
      DB_PASSWORD: booking
      FLIGHT_SERVICE_URL: http://flight-service:8080/api/flights/graphql
      # saga compensation: unpaid bookings are cancelled after this long; shorten for a demo, e.g.
      # PAYMENT_TIMEOUT=30s docker compose up -d booking-service
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-15m}
    ports: ["8082:8080"]
    depends_on:
      booking-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      flight-service: { condition: service_healthy }

  payment-service:
    <<: *service-defaults
    build: ./payment-service
    image: airport/payment-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: payment
      DB_PASSWORD: payment
    ports: ["8083:8080"]
    depends_on:
      payment-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  baggage-service:
    <<: *service-defaults
    build: ./baggage-service
    image: airport/baggage-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://baggage-db:5432/baggage_db
      DB_USERNAME: baggage
      DB_PASSWORD: baggage
    ports: ["8084:8080"]
    depends_on:
      baggage-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  shop-service:
    <<: *service-defaults
    build: ./shop-service
    image: airport/shop-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://shop-db:5432/shop_db
      DB_USERNAME: shop
      DB_PASSWORD: shop
      # askRoute ("Spørg om vej"): the local LLM lives in the `ollama` service below. Deliberately NO depends_on:
      # shop-service starts and is healthy without it, and askRoute then answers with the keyword fallback
      # (aiUsed=false + fallbackReason). Start the model with `docker compose --profile ai up`.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    ports: ["8085:8080"]
    depends_on:
      shop-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ------------------------------------------------------------ AI (optional)
  # Local LLM for shop-service's askRoute (dev plan DP-16). Only started with the `ai` profile:
  #     docker compose --profile ai up -d --wait          (or: docker compose --profile ai up --build)
  # The image (ollama/Dockerfile) has the model qwen2.5:1.5b baked in, so nothing is downloaded at start-up.
  # Resources: CPU inference only - no GPU needed. Roughly 1.2 GB on disk, ~1.5 GB RAM while the model is loaded
  # (it is unloaded again after OLLAMA_KEEP_ALIVE of idle time and reloaded in ~1-2 s on the next question),
  # and 2-6 s per question on a laptop CPU with ~4 cores. One question at a time (OLLAMA_NUM_PARALLEL=1).
  ollama:
    build: ./ollama
    image: airport/ollama:local
    profiles: [ai]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
    ports: ["11434:11434"]
    healthcheck:
      # The image has no curl/wget; the ollama CLI talks to the server on localhost:11434 and lists the models.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------- jobs (optional)
  # notification-job (dev plan DP-20): drains the `notifications` queue (all booking.# events, declared by
  # booking-service), logs one Danish e-mail per event and exits with 0 once the queue has been idle for
  # IDLE_TIMEOUT_MS. Run-to-completion, so it is not part of a plain `docker compose up`; run it on demand with
  #     docker compose --profile jobs up notification-job        (build first: docker compose build notification-job)
  # In Kubernetes the same image runs as a KEDA ScaledJob that scales on the queue length (DP-21).
  notification-job:
    build: ./notification-job
    image: airport/notification-job:local
    profiles: [jobs]
    restart: "no"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: airport
      RABBITMQ_PASSWORD: airport
      NOTIFICATION_QUEUE: notifications
      MAX_MESSAGES: "100"
      IDLE_TIMEOUT_MS: "5000"
    depends_on:
      rabbitmq: { condition: service_healthy }

  # -------------------------------------------------------------- frontend
  frontend:
    build: ./frontend
    image: airport/frontend:local
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      - flight-service
      - booking-service
      - payment-service
      - baggage-service
      - shop-service

volumes:
  rabbitmq-data:
  flight-db-data:
  booking-db-data:
  payment-db-data:
  baggage-db-data:
  shop-db-data:
